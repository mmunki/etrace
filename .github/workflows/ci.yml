name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build and run the test suite
        run: |
          make -j"$(nproc)" all test_crash
          make test

      - name: Build the static release binary
        run: make release ARCH_NAME=${{ matrix.arch }}

      - name: Test the static release binary
        run: |
          make test_crash
          ETRACE_BIN=./dist/etrace-${{ matrix.arch }} \
            TEST_CRASH=./test_crash bash tests/run_tests.sh

      - name: Upload the static binary
        uses: actions/upload-artifact@v4
        with:
          name: etrace-${{ matrix.arch }}
          path: dist/etrace-${{ matrix.arch }}
          if-no-files-found: error
